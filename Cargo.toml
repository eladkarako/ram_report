[package]
authors = ["Elad Karako <eladkarako@gmail.com>"]
categories = ["command-line-utilities", "memory"]
description = "RAM info in terminal (press: [q] to quit, [r] to reset a reference point in-time used RAM difference)."
documentation = "https://github.com/eladkarako/ram_report#readme"
edition = "2024"
homepage = "https://github.com/eladkarako/ram_report"
keywords = ["ram", "report", "memory", "windows", "cli"]
license = "MIT"
name = "ram_report"
readme = "README.md"
repository = "https://github.com/eladkarako/ram_report"
rust-version = "1.93.0"
version = "26.11.13"

[dependencies]
anyhow = { version = "1.0.104" }
bytesize = { version = "2.7.0" }
crossterm = { version = "0.29.0", features = ["events", "libc", "windows"] }
parking_lot = { version = "0.12.5" }
ratatui = { version = "0.30.2", features = ["crossterm", "layout-cache"] }
sys-info = { version = "0.9.1" }

# Optional: Memory allocation improvements
[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "x86", target_arch = "aarch64")))'.dependencies]
mimalloc = { version = "0.1.52" }

[target.x86_64-pc-windows-msvc.build-dependencies]
toml = "1.1.8"
winres = "0.1.12"

[target.i686-pc-windows-msvc.build-dependencies]
toml = "1.1.8"
winres = "0.1.12"

[target.aarch64-pc-windows-msvc.build-dependencies]
toml = "1.1.8"
winres = "0.1.12"


[profile.release]
codegen-units = 1                                                   # Single unit for better optimization and smaller binary size
debug = false                                                       # Strip debug symbols for smaller binary
incremental = false                                                 # Disable incremental compilation for cleaner builds
lto = true                                                          # Link-time optimization for better performance
opt-level = 2                                                       # prioritizes speed (loop unrolling, better branch prediction, instruction cache fit) over binary size.
panic = "abort"                                                     # Replace unwinding with abort (smaller binary, faster panics)
rpath = false                                                       # Don't embed runtime library search paths
strip = true                                                        # Strip all symbols from final binary
